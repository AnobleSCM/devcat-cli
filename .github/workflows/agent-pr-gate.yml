name: agent-pr-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    # Pinned to the published v4 commit; workflow_call declares APP_PRIVATE_KEY as its only secret.
    uses: AnobleSCM/agent-shared-actions/.github/workflows/agent-pr-gate.yml@c9f885fafa3ba6f95fa9075a38d331b02c311a55
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
