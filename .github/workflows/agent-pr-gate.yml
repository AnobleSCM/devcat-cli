jobs:
  gate:
    uses: AnobleSCM/agent-shared-actions/.github/workflows/agent-pr-gate.yml@v2
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      CUBIC_API_KEY: ${{ secrets.CUBIC_API_KEY }}
