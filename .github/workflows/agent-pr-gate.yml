name: agent-pr-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    # v4 accepts APP_PRIVATE_KEY only; signed exact-head review replaced the retired vendor key.
    uses: AnobleSCM/agent-shared-actions/.github/workflows/agent-pr-gate.yml@v4
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
