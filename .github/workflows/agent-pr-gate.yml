name: agent-pr-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    # Secret schema proof (lines 40-42): https://github.com/AnobleSCM/agent-shared-actions/blob/c9f885fafa3ba6f95fa9075a38d331b02c311a55/.github/workflows/agent-pr-gate.yml#L40-L42
    #   on.workflow_call.secrets.APP_PRIVATE_KEY.required: true
    uses: AnobleSCM/agent-shared-actions/.github/workflows/agent-pr-gate.yml@c9f885fafa3ba6f95fa9075a38d331b02c311a55
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
