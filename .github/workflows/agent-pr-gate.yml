# Reusable workflow for the signed-fallback agent-pr-gate. Caller stubs use
# `@v3` or `@v4`; both release aliases publish this same contract. The required
# AI-review gate is the exact-head signed agent-fallback-review:v2 receipt,
# checked by the `agent-pr-gate-ai-review` job. The legacy external-vendor path
# and its API-key secret are retired.
#
# Per RESEARCH.md Pitfall #2: secrets: inherit does NOT work cross-repo on personal accounts.
# Caller stubs MUST pass APP_PRIVATE_KEY explicitly via secrets: block.
#
# Per RESEARCH.md Pitfall #3: actor_id for Integration bypass is the App ID (not Installation ID).
#
# Per RESEARCH.md Pitfall #5: on: pull_request workflow file source is the PR head branch
# (NOT the default branch). Threat model per CONTEXT.md D-03: Andrew's agents push to his own
# repos; no fork-PR class.
#
# Defense-in-depth (workflow injection): all github.* template expressions are placed in
# env: blocks and accessed as shell variables in run: scripts. See
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

# Repository-local copy of AnobleSCM/agent-shared-actions gate v4.
# Source commit: c9f885fafa3ba6f95fa9075a38d331b02c311a55
# Devcat is public, so GitHub cannot call the private reusable workflow directly.

name: agent-pr-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  policy:
    name: agent-pr-gate-policy   # MUST match Ruleset required_status_checks[].context
    runs-on: ubuntu-latest
    outputs:
      should-merge: ${{ steps.evaluate.outputs.should-merge }}
      reject-reason: ${{ steps.evaluate.outputs.reject-reason }}
    steps:
      - name: Mint App installation token (for cross-repo checkout)
        id: app-token-policy
        # actions/create-github-app-token v3.1.1 SHA-pinned per D-07.
        # Scoped to agent-shared-actions only (least privilege — read-only checkout).
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: AnobleSCM
          repositories: agent-shared-actions

      - name: Checkout agent-shared-actions repo (for scripts)
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938   # v4.2.0 SHA-pinned per D-07
        with:
          repository: AnobleSCM/agent-shared-actions
          # Downstream caller repos must execute the pinned v4 helper scripts.
          # Self-PRs in agent-shared-actions need the PR branch helpers so new
          # parser/policy changes can be validated before the v4 tag moves.
          ref: c9f885fafa3ba6f95fa9075a38d331b02c311a55
          path: agent-shared-actions
          token: ${{ steps.app-token-policy.outputs.token }}

      - name: Install Python deps
        run: python3 -m pip install pyyaml jsonschema --user

      - name: Fetch changed paths
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' > /tmp/changed_paths.txt
          echo "Changed paths:"
          cat /tmp/changed_paths.txt

      - name: Fetch PR comments and reviews
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # gh CLI --slurp wraps all paginated JSON pages in one outer array.
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate --slurp > /tmp/pr_comments.json
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --paginate --slurp > /tmp/pr_reviews.json

      - name: Evaluate auto-merge policy (D-04 + D-05 + D-10)
        id: evaluate
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels) }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_SENDER: ${{ github.event.sender.login }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          export CHANGED_PATHS="$(cat /tmp/changed_paths.txt)"
          export PR_COMMENTS_JSON_FILE=/tmp/pr_comments.json
          export PR_REVIEWS_JSON_FILE=/tmp/pr_reviews.json
          bash agent-shared-actions/scripts/evaluate-policy.sh

      - name: Comment rejection on PR (when policy fails on labeled event)
        if: steps.evaluate.outputs.should-merge == 'false' && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASON: ${{ steps.evaluate.outputs.reject-reason }}
        run: |
          gh pr comment "${PR_NUMBER}" \
            --repo "${REPO}" \
            --body "Auto-merge rejected: \`${REASON}\` (per D-04/D-05/D-10 in Phase 999.2). PR remains open for manual review."

      - name: Remove agent-routine label on label-actor failure (D-05)
        if: contains(steps.evaluate.outputs.reject-reason, 'label-actor-untrusted')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "${PR_NUMBER}" \
            --repo "${REPO}" \
            --remove-label "agent-routine" || true

  ai-review-check:
    name: agent-pr-gate-ai-review
    runs-on: ubuntu-latest
    # No per-job permissions block: inherits workflow-level (contents: read, pull-requests: write).
    # The per-job permissions narrowing in v2.0.0 caused startup_failure for callers (the
    # reusable-workflow + workflow_call + narrowed-permissions combination didn't validate).
    steps:
      - name: Set up Python 3
        # SHA-pinned per the repo convention (actions/setup-python v5.6.0 → see RESEARCH.md
        # Pitfall #7: org policy / convention requires SHA-pinning to prevent supply-chain risk).
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Mint App installation token (for cross-repo checkout)
        id: app-token-ai-review
        # actions/create-github-app-token v3.1.1 SHA-pinned per D-07.
        # Scoped to agent-shared-actions only (least privilege — read-only checkout).
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: AnobleSCM
          repositories: agent-shared-actions

      - name: Checkout agent-shared-actions repo (for review-gate scripts)
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938   # v4.2.0 SHA-pinned per D-07
        with:
          repository: AnobleSCM/agent-shared-actions
          ref: c9f885fafa3ba6f95fa9075a38d331b02c311a55
          path: agent-shared-actions
          token: ${{ steps.app-token-ai-review.outputs.token }}

      - name: Signed fallback AI review (REQUIRED — exact-head signed receipt)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_MODE: signed-fallback-only
        run: |
          set -euo pipefail

          require_signed_fallback_review() {
            echo "::notice::Review mode signed-fallback-only: requiring signed independent fallback receipt for ${REPO}#${PR_NUMBER} at ${PR_HEAD_SHA}."

            SIGNED_FALLBACK_RECEIPT_ATTEMPTS="${SIGNED_FALLBACK_RECEIPT_ATTEMPTS:-30}"
            SIGNED_FALLBACK_RECEIPT_INTERVAL_SECONDS="${SIGNED_FALLBACK_RECEIPT_INTERVAL_SECONDS:-10}"

            fetch_fallback_review_data() {
              if ! gh api -X GET "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --slurp > /tmp/fallback_comments.json; then
                return 1
              fi
              if ! gh api -X GET "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate --slurp > /tmp/fallback_reviews.json; then
                return 1
              fi
            }

            for attempt in $(seq 1 "${SIGNED_FALLBACK_RECEIPT_ATTEMPTS}"); do
              if ! fetch_fallback_review_data; then
                if [ "$attempt" -lt "$SIGNED_FALLBACK_RECEIPT_ATTEMPTS" ]; then
                  echo "::notice::Signed fallback receipt data fetch failed; retrying (${attempt}/${SIGNED_FALLBACK_RECEIPT_ATTEMPTS})."
                  sleep "${SIGNED_FALLBACK_RECEIPT_INTERVAL_SECONDS}"
                  continue
                fi
                echo "::error::Signed fallback receipt data fetch failed after ${SIGNED_FALLBACK_RECEIPT_ATTEMPTS} attempt(s); review gate failed closed."
                exit 1
              fi

              status_json=$(python3 agent-shared-actions/scripts/agent_fallback_review_gate.py \
                --comments-json /tmp/fallback_comments.json \
                --reviews-json /tmp/fallback_reviews.json \
                --repo "$REPO" \
                --pr "$PR_NUMBER" \
                --head-sha "$PR_HEAD_SHA" \
                --mode status-json \
                --require-signed-fallback)
              status=$(python3 -c 'import json, sys; print(json.load(sys.stdin).get("status", ""))' <<<"${status_json}")

              if [ "$status" = "accepted" ]; then
                echo "$status_json"
                echo "::notice::Signed fallback AI-review receipt accepted for this exact PR/head."
                return 0
              fi

              if [ "$status" = "receipt_not_clean" ]; then
                echo "$status_json"
                echo "::error::Signed fallback AI-review receipt exists for this exact PR/head, but it is not clean; review remains blocking."
                exit 1
              fi

              if [ "$status" = "receipt_invalid" ]; then
                echo "$status_json"
                echo "::error::Signed fallback AI-review receipt exists for this exact PR/head, but it is invalid; review gate failed closed."
                exit 1
              fi

              if [ "$status" != "awaiting_receipt" ]; then
                echo "$status_json"
                echo "::error::Unexpected signed fallback receipt status '${status}'; review gate failed closed."
                exit 1
              fi

              if [ "$attempt" -lt "$SIGNED_FALLBACK_RECEIPT_ATTEMPTS" ]; then
                echo "::notice::Awaiting exact-head signed agent-fallback-review:v2 receipt for ${REPO}#${PR_NUMBER} at ${PR_HEAD_SHA}; retrying (${attempt}/${SIGNED_FALLBACK_RECEIPT_ATTEMPTS})."
                sleep "${SIGNED_FALLBACK_RECEIPT_INTERVAL_SECONDS}"
              fi
            done

            echo "$status_json"
            echo "::error::Awaiting exact-head signed agent-fallback-review:v2 receipt for ${REPO}#${PR_NUMBER} at ${PR_HEAD_SHA}; no matching clean receipt arrived after ${SIGNED_FALLBACK_RECEIPT_ATTEMPTS} attempt(s)."
            echo "::error::Post a signed clean independent fallback review receipt with repo, pr, head_sha, author_runtime, reviewer_runtime, result=clean, blocking_findings=0, signature_algorithm=rsa-sha256-v1, and signature."
            exit 1
          }

          if [ "$REVIEW_MODE" != "signed-fallback-only" ]; then
            echo "::error::review-mode '$REVIEW_MODE' is not supported; only 'signed-fallback-only' is supported. Drop the input or set review-mode: signed-fallback-only."
            exit 1
          fi
          require_signed_fallback_review

      - name: Gemini findings check (ADVISORY — use if already available)
        # Gemini is advisory. Quota limits, missing reviews, malformed response
        # data, or GitHub API fetch issues must not fail this step. The required
        # AI-review gate is the exact-head signed agent-fallback-review:v2 receipt
        # checked in the preceding step; Gemini only logs advisory signal.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          fetch_gemini_data() {
            gh api -X GET "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate --slurp > /tmp/gemini_reviews.json
            gh api -X GET "repos/${REPO}/pulls/${PR_NUMBER}/comments" --paginate --slurp > /tmp/gemini_comments.json
          }

          if ! fetch_gemini_data; then
            echo "::notice::Gemini advisory skipped: GitHub API fetch for reviews/comments failed. The signed fallback review remains the required gate."
            exit 0
          fi

          presence=$(python3 agent-shared-actions/scripts/gemini_findings_gate.py \
            --reviews-json /tmp/gemini_reviews.json \
            --comments-json /tmp/gemini_comments.json \
            --mode presence)

          if [ "$presence" != "1" ]; then
            echo "::notice::Gemini advisory skipped: no Gemini review/comment was available yet. The signed fallback review remains the required gate."
            exit 0
          fi

          # If Gemini is already present, give GitHub a small settle window so
          # line-level comments from the same review are visible before the
          # advisory count. This avoids blocking on Gemini while preserving
          # useful signals when it happens to arrive early.
          sleep 5
          if ! fetch_gemini_data; then
            echo "::notice::Gemini advisory skipped: re-fetch failed after initial presence. The signed fallback review remains the required gate."
            exit 0
          fi

          BLOCKING_COUNT=$(python3 agent-shared-actions/scripts/gemini_findings_gate.py \
            --reviews-json /tmp/gemini_reviews.json \
            --comments-json /tmp/gemini_comments.json \
            --mode blocking-count)

          echo "Gemini blocking findings (P0/P1): $BLOCKING_COUNT"
          if [ "$BLOCKING_COUNT" -gt 0 ]; then
            echo "::warning::Gemini advisory flagged $BLOCKING_COUNT P0/P1-style finding(s). Auto-merge is not denied; the signed fallback review is the required gate."
            exit 0
          fi
          echo "::notice::Gemini advisory checked: review present, 0 P0/P1-style findings."

  merge:
    name: agent-pr-gate-merge
    needs: [policy, ai-review-check]
    if: github.event.pull_request.draft == false && needs.policy.outputs.should-merge == 'true' && needs.ai-review-check.result == 'success'
    runs-on: ubuntu-latest
    # No job-level permissions: this job uses the App-minted token (steps.app-token.outputs.token)
    # for gh pr merge --auto. GITHUB_TOKEN is unused for writes here, so no elevation needed.
    # Job-level permissions block was triggering startup_failure because it exceeded workflow-level grant.
    steps:
      - name: Mint App installation token (for caller merge)
        id: app-token
        # actions/create-github-app-token v3.1.1 SHA-pinned per D-07.
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Mint App installation token (for merge helper checkout)
        id: app-token-helpers
        # actions/create-github-app-token v3.1.1 SHA-pinned per D-07.
        # Scoped to agent-shared-actions only so downstream private repos can
        # read the pinned helper scripts without reusing the caller merge token.
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: AnobleSCM
          repositories: agent-shared-actions

      - name: Checkout agent-shared-actions repo (for merge helpers)
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938   # v4.2.0 SHA-pinned per D-07
        with:
          repository: AnobleSCM/agent-shared-actions
          # Downstream caller repos must execute the pinned v4 helper scripts.
          # Self-PRs in agent-shared-actions need the PR branch helpers so new
          # merge-preflight changes can be validated before the v4 tag moves.
          ref: c9f885fafa3ba6f95fa9075a38d331b02c311a55
          path: agent-shared-actions
          token: ${{ steps.app-token-helpers.outputs.token }}

      - name: Require caller-selected checks before admin merge
        if: ${{ false }}
        env:
          # Use the App installation token (not GITHUB_TOKEN) to read check-runs.
          # This keeps the reusable workflow from requesting `checks: read` at the
          # top level, which exceeds downstream caller stubs' granted permissions
          # (contents: read, pull-requests: write) and causes a startup_failure for
          # every @v3/@v4 caller. This step is opt-in (only runs when required-extra-checks
          # is set), so the App token must have checks:read for callers that use it.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REQUIRED_EXTRA_CHECKS: "[]"
        run: |
          set -euo pipefail
          echo "Required extra checks: ${REQUIRED_EXTRA_CHECKS}"

          for attempt in $(seq 1 24); do
            gh api --method GET "repos/${REPO}/commits/${PR_HEAD_SHA}/check-runs" \
              -f per_page=100 > /tmp/head_check_runs.json

            set +e
            python3 agent-shared-actions/scripts/require_check_run_success.py \
              --check-runs-json /tmp/head_check_runs.json \
              --required-checks-json "${REQUIRED_EXTRA_CHECKS}"
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -eq 1 ]; then
              exit 1
            fi
            if [ "$attempt" -eq 24 ]; then
              break
            fi
            echo "::notice::Required extra checks are pending or missing; retrying (${attempt}/24)."
            sleep 5
          done

          echo "::error::Timed out waiting for required extra checks to succeed on ${PR_HEAD_SHA}; admin merge denied."
          python3 agent-shared-actions/scripts/require_check_run_success.py \
            --check-runs-json /tmp/head_check_runs.json \
            --required-checks-json "${REQUIRED_EXTRA_CHECKS}" || true
          exit 1

      - name: Merge PR (direct merge as bypass actor)
        # The App is a Ruleset bypass actor (actor_type: Integration). Direct merge
        # via the App-minted token bypasses the require-1-approval rule. We do NOT
        # use --auto because auto-merge is a queued action that GitHub evaluates later
        # WITHOUT applying the bypass-actor logic, so it would wait indefinitely for
        # an approval that the bot can't give itself. Direct merge as bypass actor is
        # the supported pattern.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge --squash --delete-branch --admin "${PR_NUMBER}" \
            --repo "${REPO}"
